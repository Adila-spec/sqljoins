<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Query Practice — Investigo Schema Drills</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Boogaloo&family=Nunito:wght@400;600;700;800&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg: #16301f;
    --panel: #faf1da;
    --panel-alt: #b9c9a0;
    --border: #5a7a4e;
    --border-soft: #a9c090;
    --text: #2b1a16;
    --text-dim: #6e463f;
    --text-faint: #a1806f;
    --accent: #7a1f2e;
    --accent-dim: rgba(122,31,46,0.13);
    --accent-line: rgba(122,31,46,0.5);
    --warm: #b8862e;
    --warm-dim: rgba(184,134,46,0.22);
    --mint: #2f4a34;
    --mint-dim: rgba(47,74,52,0.18);
    --spot: #3a1c1c;
    --leopard: radial-gradient(circle at 15% 25%, var(--spot) 9%, transparent 10%),
               radial-gradient(circle at 42% 12%, var(--spot) 7%, transparent 8%),
               radial-gradient(circle at 68% 30%, var(--spot) 10%, transparent 11%),
               radial-gradient(circle at 88% 15%, var(--spot) 6%, transparent 7%),
               radial-gradient(circle at 28% 65%, var(--spot) 8%, transparent 9%),
               radial-gradient(circle at 58% 78%, var(--spot) 9%, transparent 10%),
               radial-gradient(circle at 82% 68%, var(--spot) 7%, transparent 8%),
               radial-gradient(circle at 5% 85%, var(--spot) 6%, transparent 7%);
    --zebra: repeating-linear-gradient(48deg, var(--spot) 0 7px, transparent 7px 16px);
  }

  * { box-sizing: border-box; }

  html, body {
    height: 100%;
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: 'Nunito', sans-serif;
  }

  .print-strip{
    height: 12px;
    width: 100%;
    background-color: var(--warm);
    background-image: var(--leopard);
    background-size: 90px 60px;
    flex: 0 0 auto;
  }
  .print-strip.zebra{
    background-color: var(--panel-alt);
    background-image: var(--zebra);
  }

  ::selection { background: var(--accent-dim); color: var(--accent); }

  ::-webkit-scrollbar { width: 10px; height: 10px; }
  ::-webkit-scrollbar-track { background: transparent; }
  ::-webkit-scrollbar-thumb { background: #ddd3f2; border-radius: 8px; border: 2px solid var(--panel); }
  ::-webkit-scrollbar-thumb:hover { background: #cabbe8; }

  header {
    border-bottom: 3px solid var(--accent);
    background: var(--panel);
    box-shadow: 0 2px 10px rgba(58,35,19,0.12);
    padding: 16px 28px 0 28px;
    position: sticky;
    top: 0;
    z-index: 10;
  }

  .header-top {
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    gap: 16px;
    margin-bottom: 16px;
    flex-wrap: wrap;
  }

  .brand {
    font-family: 'Boogaloo', sans-serif;
    font-weight: 400;
    font-size: 26px;
    letter-spacing: 0.02em;
    color: var(--accent);
    display: flex;
    align-items: center;
    gap: 10px;
  }

  .brand .dot {
    width: 22px;
    height: 22px;
    border-radius: 50%;
    background-color: var(--warm);
    background-image: var(--leopard);
    background-size: 30px 20px;
    box-shadow: 0 0 0 3px var(--accent-dim);
  }

  .brand-sub {
    font-family: 'JetBrains Mono', monospace;
    font-size: 12px;
    color: var(--text-faint);
  }

  .tabs {
    display: flex;
    gap: 2px;
    overflow-x: auto;
    scrollbar-width: thin;
    padding-bottom: 0;
  }

  .tab {
    font-family: 'JetBrains Mono', monospace;
    font-size: 12.5px;
    color: var(--text-dim);
    background: transparent;
    border: 1px solid transparent;
    border-bottom: none;
    padding: 9px 16px 10px 16px;
    white-space: nowrap;
    cursor: pointer;
    border-radius: 10px 10px 0 0;
    display: flex;
    align-items: center;
    gap: 8px;
    transition: color .15s ease, background .15s ease;
  }

  .tab .num { color: var(--text-faint); }

  .tab:hover { color: var(--text); background: var(--warm-dim); }

  .tab.active {
    color: var(--accent);
    background: var(--panel);
    border-color: var(--border);
    border-bottom: 1px solid var(--panel);
    margin-bottom: -1px;
    font-weight: 800;
    position: relative;
  }

  .tab.active::after {
    content: "";
    position: absolute;
    left: 6px;
    right: 6px;
    bottom: -1px;
    height: 4px;
    background-image: var(--zebra);
    background-size: 16px 100%;
    border-radius: 2px;
  }

  .tab.active .num { color: var(--accent); }

  main {
    display: grid;
    grid-template-columns: minmax(320px, 40%) 1fr;
    height: calc(100vh - 108px);
  }

  @media (max-width: 860px) {
    main { grid-template-columns: 1fr; height: auto; }
    .panel { height: 60vh; }
  }

  .panel {
    height: calc(100vh - 108px);
    overflow-y: auto;
    padding: 22px 24px 60px 24px;
  }

  .panel-left {
    background: var(--panel-alt);
    border-right: 1px solid var(--border);
  }

  .panel-right {
    background: var(--panel);
  }

  .panel-eyebrow {
    font-family: 'JetBrains Mono', monospace;
    font-size: 11px;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: var(--text-faint);
    margin-bottom: 14px;
  }

  .table-card {
    border: 2px solid var(--border-soft);
    border-radius: 12px;
    margin-bottom: 18px;
    background: var(--panel);
    overflow: hidden;
    box-shadow: 0 2px 4px rgba(58,35,19,0.08);
    transition: opacity .2s ease, border-color .2s ease, transform .2s ease;
  }

  .table-card.dim { opacity: 0.42; }

  .table-card.relevant {
    border-color: var(--accent);
    box-shadow: 0 4px 14px rgba(122,31,46,0.24);
    transform: translateY(-1px);
  }

  .table-label {
    font-family: 'JetBrains Mono', monospace;
    font-size: 12.5px;
    padding: 9px 14px;
    color: var(--warm);
    background: rgba(227,179,65,0.05);
    border-bottom: 1px solid var(--border-soft);
    display: flex;
    justify-content: space-between;
    align-items: center;
  }

  .table-card.relevant .table-label { color: var(--accent); background: var(--accent-dim); font-weight: 600; }

  .table-label .comment-slash { color: var(--text-faint); margin-right: 4px; }

  .table-wrap { overflow-x: auto; }

  table.sample {
    border-collapse: collapse;
    width: 100%;
    font-family: 'JetBrains Mono', monospace;
    font-size: 11.5px;
    white-space: nowrap;
  }

  table.sample th {
    text-align: left;
    color: var(--mint);
    font-weight: 600;
    padding: 7px 12px;
    background: var(--panel-alt);
    border-bottom: 1px solid var(--border-soft);
    position: sticky;
    top: 0;
  }

  table.sample td {
    padding: 6px 12px;
    color: var(--text);
    border-bottom: 1px solid var(--border-soft);
  }

  table.sample tr:nth-child(even) td { background: rgba(255,93,143,0.025); }

  .topic-head {
    margin-bottom: 22px;
    padding-bottom: 18px;
    border-bottom: 1px solid var(--border-soft);
  }

  .topic-head h1 {
    font-family: 'Boogaloo', sans-serif;
    font-size: 30px;
    font-weight: 400;
    margin: 0 0 8px 0;
    letter-spacing: 0.02em;
    color: var(--accent);
  }

  .topic-head p {
    margin: 0;
    color: var(--text-dim);
    font-size: 14px;
    line-height: 1.55;
    max-width: 60ch;
  }

  .q-thread {
    position: relative;
    padding-left: 30px;
  }

  .q-thread::before {
    content: "";
    position: absolute;
    left: 9px;
    top: 6px;
    bottom: 6px;
    width: 4px;
    border-radius: 3px;
    background-color: var(--warm);
    background-image: var(--zebra);
    background-size: 4px 14px;
  }

  .q-card {
    position: relative;
    margin-bottom: 22px;
  }

  .q-card::before {
    content: attr(data-n);
    position: absolute;
    left: -30px;
    top: 2px;
    width: 20px;
    text-align: right;
    font-family: 'JetBrains Mono', monospace;
    font-size: 11px;
    font-weight: 700;
    color: var(--accent);
  }

  .q-card::after {
    content: "";
    position: absolute;
    left: -23px;
    top: 5px;
    width: 10px;
    height: 10px;
    border-radius: 50%;
    background-color: var(--warm);
    background-image: var(--leopard);
    background-size: 12px 8px;
    border: 2px solid var(--panel);
  }

  .q-body {
    background: var(--panel);
    border: 2px solid var(--border-soft);
    border-radius: 12px;
    padding: 14px 16px;
    font-size: 14.5px;
    line-height: 1.6;
    color: var(--text);
    box-shadow: 0 2px 4px rgba(58,35,19,0.08);
    transition: box-shadow .15s ease, transform .15s ease;
  }

  .q-body:hover {
    box-shadow: 0 4px 14px rgba(122,31,46,0.20);
    transform: translateY(-1px);
  }

  .q-body code {
    font-family: 'JetBrains Mono', monospace;
    font-size: 13px;
    font-weight: 600;
    background: var(--warm-dim);
    color: #5c3a0e;
    padding: 1px 6px;
    border-radius: 5px;
  }

  .q-body .hint {
    display: block;
    margin-top: 8px;
    color: var(--mint);
    font-size: 12.5px;
    font-family: 'JetBrains Mono', monospace;
    background: var(--mint-dim);
    padding: 6px 10px;
    border-radius: 6px;
    border-left: 3px solid var(--mint);
  }

  .q-body .hint::before { content: "→ "; color: var(--mint); }

  footer.hint-strip {
    font-family: 'JetBrains Mono', monospace;
    font-size: 11px;
    color: var(--text-dim);
    padding: 10px 24px;
    border-top: 1px solid var(--border);
    background: var(--panel-alt);
  }
</style>
</head>
<body>

<div class="print-strip"></div>
<header>
  <div class="header-top">
    <div class="brand"><span class="dot"></span>query practice<span class="brand-sub">// investigo schema, scaled down</span></div>
    <div class="brand-sub" id="topic-counter">topic 1 / 7</div>
  </div>
  <nav class="tabs" id="tabs"></nav>
</header>

<main>
  <section class="panel panel-left" id="panel-left">
    <div class="panel-eyebrow">sample tables — fewer rows, same shapes</div>
    <div id="tables-mount"></div>
  </section>

  <section class="panel panel-right" id="panel-right">
    <div id="questions-mount"></div>
  </section>
</main>

<div class="print-strip zebra"></div>
<footer class="hint-strip">scroll each panel independently — tables stay put on the left, questions build top to bottom on the right</footer>

<script>
const TABLES = {
  transactions: {
    cols: ["recid","accountid","trancodeid","netamount","effectivedate"],
    rows: [
      [1001,1,10,"500.00","2026-01-05"],
      [1002,1,20,"-200.00","2026-01-10"],
      [1003,2,10,"1500.00","2026-02-01"],
      [1004,2,30,"300.00","2026-02-15"],
      [1005,3,10,"750.00","2026-03-01"],
      [1006,1,20,"-50.00","2026-03-05"],
      [1007,3,30,"200.00","2026-03-20"],
    ]
  },
  transaction_note: {
    cols: ["transactionid","note"],
    rows: [
      [1001,"ACATS in from B3S-732073"],
      [1002,"monthly advisory fee"],
      [1003,"ACATS in from J7Z-119002"],
      [1004,"dividend reinvestment"],
      [1006,"ACATS in from B3S-118820"],
    ]
  },
  account: {
    cols: ["recid","accountno","representativeid","custodianid"],
    rows: [
      [1,"J7Z022009",1,10],
      [2,"J7M242999",2,12],
      [3,"C9B024306",1,10],
    ]
  },
  representative: {
    cols: ["recid","repcode","firstname","lastname"],
    rows: [
      [1,"4BL","Dana","Reyes"],
      [2,"4CT","Marcus","Lin"],
    ]
  },
  trancode: {
    cols: ["recid","trancode","description"],
    rows: [
      [10,100,"ACATS Transfer In"],
      [20,200,"Advisory Fee"],
      [30,300,"Dividend Reinvestment"],
    ]
  },
  monthlyflows: {
    cols: ["investigoaccountid","firm_name","transaction_date"],
    rows: [
      [1,"Freeman Financial- Firm","2026-01-05"],
      [1,"Freeman Financial- Firm","2026-03-05"],
      [2,"Freeman Financial- Firm","2026-02-01"],
      [2,"Freeman Financial- Firm","2026-02-20"],
      [3,"Riverstone Advisors","2026-03-01"],
      [3,"Riverstone Advisors","2026-03-20"],
    ]
  }
};

const TOPICS = [
  {
    id: "joins",
    label: "Joins & Schema",
    tables: ["transactions","account","transaction_note","representative"],
    intro: "Start here. Every other topic reuses these joins, so get comfortable moving between transactions, account, transaction_note, and representative before adding filters or regex on top.",
    questions: [
      `Join <code>transactions</code> to <code>account</code> on <code>t.accountid = a.recid</code>. List <code>accountno</code> and <code>netamount</code> for every transaction.<span class="hint">how many rows come back, and why does that match the row count of transactions itself?</span>`,
      `Add <code>transaction_note</code> as a <code>LEFT JOIN</code> on <code>transactionid = t.recid</code>. Transactions 1005 and 1007 have no matching note.<span class="hint">do those two rows disappear, or stay with a blank note column?</span>`,
      `Change that same join to a plain <code>JOIN</code> (inner join) instead of <code>LEFT JOIN</code>.<span class="hint">which two recids vanish from the output, and why exactly those two?</span>`,
      `Join <code>representative</code> on <code>a.representativeid = r.recid</code>. Look up accountno <code>C9B024306</code>.<span class="hint">which repcode comes back — and does adding this join ever shrink your row count in this dataset?</span>`,
      `Combine all four tables (transactions, account, transaction_note as LEFT JOIN, representative) and filter <code>WHERE a.accountno = 'J7Z022009'</code>.<span class="hint">predict the row count and the note value for transaction 1002 before you check it</span>`,
    ]
  },
  {
    id: "filtering",
    label: "Filtering",
    tables: ["transactions","trancode"],
    intro: "Take the four-table query from Joins & Schema and start narrowing it down. Each question swaps one filter for another so you can see where they agree and where they quietly diverge.",
    questions: [
      `Drop the accountno filter from the Topic 1 query. Add <code>WHERE 1=1 AND t.netamount &gt; 0</code>.<span class="hint">which trancode's rows get excluded entirely — check trancode 20's amounts</span>`,
      `Replace that with <code>AND t.trancodeid NOT IN (20)</code>.<span class="hint">does this produce the exact same result as netamount &gt; 0? find one row where the two disagree</span>`,
      `Replace the filter again with <code>AND month(t.effectivedate) = 3</code>.<span class="hint">which recids match, and which trancode shows up twice in March?</span>`,
      `Switch to <code>AND t.effectivedate BETWEEN '2026-02-01' AND '2026-02-28'</code>.<span class="hint">does 1004 (dated 2026-02-15) qualify? what would change if effectivedate were a timestamp instead of a date?</span>`,
      `Add <code>AND a.accountno = 'J7M242999'</code> on top of the March filter from question 3.<span class="hint">how many rows survive both conditions at once?</span>`,
    ]
  },
  {
    id: "regex",
    label: "Regex Extraction",
    tables: ["transaction_note"],
    intro: "All five notes live in one small table — enough variety to test a regex against real matches and real misses before you trust it on production data.",
    questions: [
      `Select <code>note</code> from <code>transaction_note</code> where <code>note RLIKE 'B3S-\\\\d+'</code>.<span class="hint">which two notes match, and which three fall through?</span>`,
      `Add <code>regexp_extract(note, 'B3S-(\\\\d+)', 1) AS old_account</code>.<span class="hint">what comes back for transaction 1001's note vs. transaction 1003's note, which uses a different prefix entirely?</span>`,
      `Generalize the pattern to <code>regexp_extract(note, '([A-Z][A-Z0-9]{2})-(\\\\d+)', 1)</code> for the prefix and group 2 for the number.<span class="hint">what prefix and number extract from 1003's note, "ACATS in from J7Z-119002"?</span>`,
      `Wrap the extraction in <code>NULLIF(..., '')</code>. Look at transactions 1002 and 1004, whose notes have no dash-number pattern at all.<span class="hint">what does regexp_extract return before the NULLIF, and what does it return after?</span>`,
      `Add a boolean column: <code>note RLIKE '[A-Z][A-Z0-9]{2}-\\\\d+' AS has_prefix</code>.<span class="hint">which of the five notes get TRUE and which get FALSE?</span>`,
    ]
  },
  {
    id: "ctes",
    label: "CTEs",
    tables: ["monthlyflows","account"],
    intro: "monthlyflows has two rows for every account — a small enough duplication problem to reason about by hand before you meet it at real scale.",
    questions: [
      `Write a CTE <code>acct_flows</code>: <code>SELECT investigoaccountid, firm_name FROM monthlyflows WHERE firm_name = 'Freeman Financial- Firm'</code>.<span class="hint">how many rows does the CTE return on its own, before any joining?</span>`,
      `Join <code>acct_flows</code> to <code>account</code> on <code>investigoaccountid = recid</code>, selecting <code>accountno</code>.<span class="hint">accountno J7Z022009 has two matching flow rows — does it appear once or twice in the joined output?</span>`,
      `Rewrite question 2 as a subquery in the FROM clause instead of a named CTE.<span class="hint">what changes if you need to reference acct_flows a second time later in the same query?</span>`,
      `Add a second CTE <code>riverstone_flows</code> filtering <code>firm_name = 'Riverstone Advisors'</code>, and UNION the account numbers from both CTEs.<span class="hint">which three account numbers come back in total?</span>`,
      `Compare two named CTEs against one <code>WHERE firm_name IN (...)</code> clause.<span class="hint">which approach makes it easier to report a separate row count per firm?</span>`,
    ]
  },
  {
    id: "windows",
    label: "Window Functions & Dedup",
    tables: ["monthlyflows","transactions"],
    intro: "This is where the CTE dedup pattern from the last topic gets its teeth: monthlyflows has real duplicates per account, and the goal is exactly one row per account, chosen on purpose.",
    questions: [
      `Add <code>ROW_NUMBER() OVER (PARTITION BY investigoaccountid ORDER BY transaction_date DESC) AS rn</code> as a plain column, no filtering yet.<span class="hint">what rn does account 1's 2026-03-05 row get, versus its 2026-01-05 row?</span>`,
      `Now add <code>QUALIFY rn = 1</code>.<span class="hint">how many rows does monthlyflows collapse to, and which transaction_date survives per account?</span>`,
      `Join that deduplicated result to <code>transactions</code> on accountid, and add a second window: <code>QUALIFY ROW_NUMBER() OVER (PARTITION BY t.accountid ORDER BY t.effectivedate ASC) = 1</code>.<span class="hint">account 1 has transactions 1001, 1002, and 1006 — which single one survives?</span>`,
      `Skip the dedup step and join monthlyflows straight to transactions for account 1.<span class="hint">how many rows do you get for account 1 alone, and why (2 flow rows × 3 transactions)?</span>`,
      `Try <code>GROUP BY firm_name, investigoaccountid</code> with <code>MAX(transaction_date)</code> instead of QUALIFY.<span class="hint">what do you lose access to if you also want a non-aggregated detail column in the same row?</span>`,
    ]
  },
  {
    id: "aliasing",
    label: "Aliasing & Mixed SELECT",
    tables: ["account","representative","trancode"],
    intro: "Small, deliberate choices about column naming and what SELECT * actually costs you once you mix it with explicit columns.",
    questions: [
      `Write <code>SELECT a.accountno AS \`Account Number\`, r.repcode AS \`Rep Code\`</code> from account joined to representative.<span class="hint">why do these aliases need backticks, when <code>AS rep_code</code> wouldn't?</span>`,
      `Now write <code>SELECT a.accountno, r.repcode, *</code> from the same join.<span class="hint">do accountno and repcode show up twice in the output?</span>`,
      `Think about why someone would deliberately leave a query in that "explicit columns + *" shape rather than cleaning it up.<span class="hint">what's the debugging value of seeing both the pulled-out columns and everything else at once?</span>`,
      `Bring in <code>trancode.description AS \`Transaction Type\`</code> through transactions.<span class="hint">if two trancodes ever shared the same description text, would this alias help you tell them apart — what would you add instead?</span>`,
      `Rewrite the full query so every column has a clear, human-readable alias for a report.<span class="hint">which raw column names (recid, custodianid, representativeid) would confuse a non-technical reader if left as-is?</span>`,
    ]
  },
  {
    id: "debugging",
    label: "Debugging Workflow",
    tables: ["transactions","account"],
    intro: "The scratch-query habit: single-row lookups kept as comments in the same cell, so the next investigation starts from where the last one left off.",
    questions: [
      `Investigate why accountno <code>C9B024306</code> (recid 3) has no note on transaction 1005: <code>SELECT * FROM transactions WHERE recid = 1005</code>.<span class="hint">what does this single-row check confirm that a full join query wouldn't make as obvious?</span>`,
      `Follow up with <code>SELECT * FROM transaction_note WHERE transactionid = 1005</code>.<span class="hint">what result are you expecting, and what would it mean if a row actually came back?</span>`,
      `Write three commented-out lookups for recid 3 — one against transactions, one against account, one against monthlyflows — the way you'd leave them in a notebook cell.<span class="hint">why comment them out instead of deleting them once you're done?</span>`,
      `You ran <code>SELECT recid FROM account WHERE accountno = 'J7M242999'</code> and got back 2. Now imagine hardcoding that 2 into five scratch queries below it.<span class="hint">what breaks the next time you need to check a different account?</span>`,
      `Turn that hardcoded filter into a named CTE or a notebook parameter placeholder like <code>:account_no_search</code>.<span class="hint">what do you gain the next time you need to swap in a different account number?</span>`,
    ]
  },
];

function renderTabs(activeId) {
  const tabsEl = document.getElementById('tabs');
  tabsEl.innerHTML = '';
  TOPICS.forEach((t, i) => {
    const btn = document.createElement('button');
    btn.className = 'tab' + (t.id === activeId ? ' active' : '');
    btn.innerHTML = `<span class="num">${String(i+1).padStart(2,'0')}</span>${t.label}`;
    btn.onclick = () => selectTopic(t.id);
    tabsEl.appendChild(btn);
  });
}

function renderTables(relevantTables) {
  const mount = document.getElementById('tables-mount');
  mount.innerHTML = '';
  Object.entries(TABLES).forEach(([name, def]) => {
    const isRelevant = relevantTables.includes(name);
    const card = document.createElement('div');
    card.className = 'table-card' + (isRelevant ? ' relevant' : ' dim');

    const label = document.createElement('div');
    label.className = 'table-label';
    label.innerHTML = `<span><span class="comment-slash">--</span>${name}</span><span>${def.rows.length} rows</span>`;
    card.appendChild(label);

    const wrap = document.createElement('div');
    wrap.className = 'table-wrap';
    const table = document.createElement('table');
    table.className = 'sample';
    const thead = document.createElement('thead');
    const headRow = document.createElement('tr');
    def.cols.forEach(c => {
      const th = document.createElement('th');
      th.textContent = c;
      headRow.appendChild(th);
    });
    thead.appendChild(headRow);
    table.appendChild(thead);

    const tbody = document.createElement('tbody');
    def.rows.forEach(row => {
      const tr = document.createElement('tr');
      row.forEach(val => {
        const td = document.createElement('td');
        td.textContent = val;
        tr.appendChild(td);
      });
      tbody.appendChild(tr);
    });
    table.appendChild(tbody);
    wrap.appendChild(table);
    card.appendChild(wrap);
    mount.appendChild(card);
  });
}

function renderQuestions(topic) {
  const mount = document.getElementById('questions-mount');
  mount.innerHTML = '';

  const head = document.createElement('div');
  head.className = 'topic-head';
  head.innerHTML = `<h1>${topic.label}</h1><p>${topic.intro}</p>`;
  mount.appendChild(head);

  const thread = document.createElement('div');
  thread.className = 'q-thread';
  topic.questions.forEach((q, i) => {
    const card = document.createElement('div');
    card.className = 'q-card';
    card.setAttribute('data-n', String(i+1).padStart(2,'0'));
    const body = document.createElement('div');
    body.className = 'q-body';
    body.innerHTML = q;
    card.appendChild(body);
    thread.appendChild(card);
  });
  mount.appendChild(thread);
  document.getElementById('panel-right').scrollTop = 0;
}

function selectTopic(id) {
  const topic = TOPICS.find(t => t.id === id);
  const idx = TOPICS.findIndex(t => t.id === id);
  document.getElementById('topic-counter').textContent = `topic ${idx+1} / ${TOPICS.length}`;
  renderTabs(id);
  renderTables(topic.tables);
  renderQuestions(topic);
}

selectTopic(TOPICS[0].id);
</script>
