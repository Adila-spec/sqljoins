<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Query Practice — Investigo Schema Drills</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Boogaloo&family=Nunito:wght@400;600;700;800&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg: #16301f;
    --panel: #faf1da;
    --panel-alt: #b9c9a0;
    --border: #5a7a4e;
    --border-soft: #a9c090;
    --text: #2b1a16;
    --text-dim: #6e463f;
    --text-faint: #a1806f;
    --accent: #7a1f2e;
    --accent-dim: rgba(122,31,46,0.13);
    --accent-line: rgba(122,31,46,0.5);
    --warm: #b8862e;
    --warm-dim: rgba(184,134,46,0.22);
    --mint: #2f4a34;
    --mint-dim: rgba(47,74,52,0.18);
    --spot: #3a1c1c;
    --leopard: radial-gradient(circle at 15% 25%, var(--spot) 9%, transparent 10%),
               radial-gradient(circle at 42% 12%, var(--spot) 7%, transparent 8%),
               radial-gradient(circle at 68% 30%, var(--spot) 10%, transparent 11%),
               radial-gradient(circle at 88% 15%, var(--spot) 6%, transparent 7%),
               radial-gradient(circle at 28% 65%, var(--spot) 8%, transparent 9%),
               radial-gradient(circle at 58% 78%, var(--spot) 9%, transparent 10%),
               radial-gradient(circle at 82% 68%, var(--spot) 7%, transparent 8%),
               radial-gradient(circle at 5% 85%, var(--spot) 6%, transparent 7%);
    --zebra: repeating-linear-gradient(48deg, var(--spot) 0 7px, transparent 7px 16px);
  }

  * { box-sizing: border-box; }

  html, body {
    height: 100%;
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: 'Nunito', sans-serif;
  }

  body {
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }

  .print-strip{
    height: 12px;
    width: 100%;
    background-color: var(--warm);
    background-image: var(--leopard);
    background-size: 90px 60px;
    flex: 0 0 auto;
  }
  .print-strip.zebra{
    background-color: var(--panel-alt);
    background-image: var(--zebra);
  }

  ::selection { background: var(--accent-dim); color: var(--accent); }

  ::-webkit-scrollbar { width: 10px; height: 10px; }
  ::-webkit-scrollbar-track { background: transparent; }
  ::-webkit-scrollbar-thumb { background: #ddd3f2; border-radius: 8px; border: 2px solid var(--panel); }
  ::-webkit-scrollbar-thumb:hover { background: #cabbe8; }

  header {
    border-bottom: 3px solid var(--accent);
    background: var(--panel);
    box-shadow: 0 2px 10px rgba(58,35,19,0.12);
    padding: 16px 28px 0 28px;
    flex: 0 0 auto;
  }

  .header-top {
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    gap: 16px;
    margin-bottom: 16px;
    flex-wrap: wrap;
  }

  .brand {
    font-family: 'Boogaloo', sans-serif;
    font-weight: 400;
    font-size: 26px;
    letter-spacing: 0.02em;
    color: var(--accent);
    display: flex;
    align-items: center;
    gap: 10px;
  }

  .brand .dot {
    width: 22px;
    height: 22px;
    border-radius: 50%;
    background-color: var(--warm);
    background-image: var(--leopard);
    background-size: 30px 20px;
    box-shadow: 0 0 0 3px var(--accent-dim);
  }

  .brand-sub {
    font-family: 'JetBrains Mono', monospace;
    font-size: 12px;
    color: var(--text-faint);
  }

  .tabs {
    display: flex;
    gap: 2px;
    overflow-x: auto;
    scrollbar-width: thin;
    padding-bottom: 0;
  }

  .tab {
    font-family: 'JetBrains Mono', monospace;
    font-size: 12.5px;
    color: var(--text-dim);
    background: transparent;
    border: 1px solid transparent;
    border-bottom: none;
    padding: 9px 16px 10px 16px;
    white-space: nowrap;
    cursor: pointer;
    border-radius: 10px 10px 0 0;
    display: flex;
    align-items: center;
    gap: 8px;
    transition: color .15s ease, background .15s ease;
  }

  .tab .num { color: var(--text-faint); }

  .tab:hover { color: var(--text); background: var(--warm-dim); }

  .tab.active {
    color: var(--accent);
    background: var(--panel);
    border-color: var(--border);
    border-bottom: 1px solid var(--panel);
    margin-bottom: -1px;
    font-weight: 800;
    position: relative;
  }

  .tab.active::after {
    content: "";
    position: absolute;
    left: 6px;
    right: 6px;
    bottom: -1px;
    height: 4px;
    background-image: var(--zebra);
    background-size: 16px 100%;
    border-radius: 2px;
  }

  .tab.active .num { color: var(--accent); }

  main {
    display: grid;
    grid-template-columns: minmax(300px, 38%) 1fr;
    flex: 1 1 auto;
    min-height: 0;
  }

  .panel {
    height: 100%;
    min-height: 0;
    overflow-y: auto;
    padding: 22px 24px 60px 24px;
  }

  @media (max-width: 860px) {
    main {
      display: flex;
      flex-direction: column;
      overflow-y: auto;
    }
    .panel-right { order: -1; }
    .panel {
      height: auto;
      overflow: visible;
      max-height: none;
      padding: 18px 18px 28px 18px;
    }
    .panel-left { border-right: none; border-top: 4px solid var(--border); }
  }

  .panel-left {
    background: var(--panel-alt);
    border-right: 1px solid var(--border);
  }

  .panel-right {
    background: var(--panel);
  }

  .panel-eyebrow {
    font-family: 'JetBrains Mono', monospace;
    font-size: 11px;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: var(--text-faint);
    margin-bottom: 14px;
  }

  .table-card {
    border: 2px solid var(--border-soft);
    border-radius: 12px;
    margin-bottom: 18px;
    background: var(--panel);
    overflow: hidden;
    box-shadow: 0 2px 4px rgba(58,35,19,0.08);
    transition: opacity .2s ease, border-color .2s ease, transform .2s ease;
  }

  .table-card.dim { opacity: 0.42; }

  .table-card.relevant {
    border-color: var(--accent);
    box-shadow: 0 4px 14px rgba(122,31,46,0.24);
    transform: translateY(-1px);
  }

  .table-label {
    font-family: 'JetBrains Mono', monospace;
    font-size: 12.5px;
    padding: 9px 14px;
    color: var(--warm);
    background: rgba(227,179,65,0.05);
    border-bottom: 1px solid var(--border-soft);
    display: flex;
    justify-content: space-between;
    align-items: center;
  }

  .table-card.relevant .table-label { color: var(--accent); background: var(--accent-dim); font-weight: 600; }

  .table-label .comment-slash { color: var(--text-faint); margin-right: 4px; }

  .table-wrap { overflow-x: auto; }

  table.sample {
    border-collapse: collapse;
    width: 100%;
    font-family: 'JetBrains Mono', monospace;
    font-size: 11.5px;
    white-space: nowrap;
  }

  table.sample th {
    text-align: left;
    color: var(--mint);
    font-weight: 600;
    padding: 7px 12px;
    background: var(--panel-alt);
    border-bottom: 1px solid var(--border-soft);
    position: sticky;
    top: 0;
  }

  table.sample td {
    padding: 6px 12px;
    color: var(--text);
    border-bottom: 1px solid var(--border-soft);
  }

  table.sample tr:nth-child(even) td { background: rgba(255,93,143,0.025); }

  .topic-head {
    margin-bottom: 22px;
    padding-bottom: 18px;
    border-bottom: 1px solid var(--border-soft);
  }

  .topic-head h1 {
    font-family: 'Boogaloo', sans-serif;
    font-size: 30px;
    font-weight: 400;
    margin: 0 0 8px 0;
    letter-spacing: 0.02em;
    color: var(--accent);
  }

  .topic-head p {
    margin: 0;
    color: var(--text-dim);
    font-size: 14px;
    line-height: 1.55;
    max-width: 60ch;
  }

  .q-thread {
    position: relative;
    padding-left: 30px;
  }

  .q-thread::before {
    content: "";
    position: absolute;
    left: 9px;
    top: 6px;
    bottom: 6px;
    width: 4px;
    border-radius: 3px;
    background-color: var(--warm);
    background-image: var(--zebra);
    background-size: 4px 14px;
  }

  .q-card {
    position: relative;
    margin-bottom: 22px;
  }

  .q-card::before {
    content: attr(data-n);
    position: absolute;
    left: -30px;
    top: 2px;
    width: 20px;
    text-align: right;
    font-family: 'JetBrains Mono', monospace;
    font-size: 11px;
    font-weight: 700;
    color: var(--accent);
  }

  .q-card::after {
    content: "";
    position: absolute;
    left: -23px;
    top: 5px;
    width: 10px;
    height: 10px;
    border-radius: 50%;
    background-color: var(--warm);
    background-image: var(--leopard);
    background-size: 12px 8px;
    border: 2px solid var(--panel);
  }

  .q-body {
    background: var(--panel);
    border: 2px solid var(--border-soft);
    border-radius: 12px;
    padding: 14px 16px;
    font-size: 14.5px;
    line-height: 1.6;
    color: var(--text);
    box-shadow: 0 2px 4px rgba(58,35,19,0.08);
    transition: box-shadow .15s ease, transform .15s ease;
  }

  .q-body:hover {
    box-shadow: 0 4px 14px rgba(122,31,46,0.20);
    transform: translateY(-1px);
  }

  .q-body code {
    font-family: 'JetBrains Mono', monospace;
    font-size: 13px;
    font-weight: 600;
    background: var(--warm-dim);
    color: #5c3a0e;
    padding: 1px 6px;
    border-radius: 5px;
  }

  .q-body .hint {
    display: block;
    margin-top: 8px;
    color: var(--mint);
    font-size: 12.5px;
    font-family: 'JetBrains Mono', monospace;
    background: var(--mint-dim);
    padding: 6px 10px;
    border-radius: 6px;
    border-left: 3px solid var(--mint);
  }

  .q-body .hint::before { content: "→ "; color: var(--mint); }

  .q-answer {
    display: block;
    width: 100%;
    margin-top: 10px;
    background: var(--panel-alt);
    border: 2px dashed var(--border);
    border-radius: 10px;
    padding: 10px 12px;
    font-family: 'Nunito', sans-serif;
    font-size: 13.5px;
    line-height: 1.5;
    color: var(--text);
    resize: vertical;
    min-height: 56px;
  }

  .q-answer::placeholder { color: var(--text-faint); }

  .q-answer:focus {
    outline: none;
    border-style: solid;
    border-color: var(--accent);
    background: var(--panel);
  }
.answer-feedback {
  margin-top: 8px;
  padding: 8px 12px;
  border-radius: 8px;
  font-size: 13px;
  font-weight: 700;
}

.answer-feedback.correct {
  background: #dcfce7;
  color: #166534;
  border: 1px solid #86efac;
}

.answer-feedback.incorrect {
  background: #fee2e2;
  color: #991b1b;
  border: 1px solid #fca5a5;
}
  footer.hint-strip {
    font-family: 'JetBrains Mono', monospace;
    font-size: 11px;
    color: var(--text-dim);
    padding: 10px 24px;
    border-top: 1px solid var(--border);
    background: var(--panel-alt);
    flex: 0 0 auto;
  }
  .knowledge-box {
  background: #eff6ff;
  border: 2px solid #93c5fd;
  border-radius: 12px;
  padding: 18px;
  margin-bottom: 24px;
}

.knowledge-box h3 {
  margin-top: 0;
  color: #1d4ed8;
}

.knowledge-box ul {
  padding-left: 20px;
  margin-bottom: 0;
}

.knowledge-box li {
  margin-bottom: 8px;
}
 .show-answer-btn {
  margin-top: 10px;
  background: var(--accent);
  color: white;
  border: none;
  border-radius: 8px;
  padding: 8px 12px;
  cursor: pointer;
  font-weight: 700;
}

.show-answer-btn:hover {
  opacity: .9;
}

.solution-box {
  margin-top: 12px;
  padding: 14px;
  border-radius: 10px;
  background: #f8fafc;
  border: 1px solid #cbd5e1;
}

.solution-box h4 {
  margin-top: 0;
  margin-bottom: 8px;
  color: #1e3a8a;
}

.solution-box pre {
  background: #111827;
  color: #f9fafb;
  padding: 12px;
  border-radius: 6px;
  overflow-x: auto;
}

.solution-box code {
  font-family: 'JetBrains Mono', monospace;
  font-size: 13px;
}

.solution-box p {
  margin-bottom: 0;
  color: #374151;
}
  
</style>
</head>
<body>

<div class="print-strip"></div>
<header>
  <div class="header-top">
    <div class="brand"><span class="dot"></span>query practice<span class="brand-sub">// investigo schema, scaled down</span></div>
    <div class="brand-sub" id="topic-counter">topic 1 / 7</div>
  </div>
  <nav class="tabs" id="tabs"></nav>
</header>

<main>
  <section class="panel panel-left" id="panel-left">
    <div class="panel-eyebrow">sample tables — fewer rows, same shapes</div>
    <div id="tables-mount"></div>
  </section>

  <section class="panel panel-right" id="panel-right">
    <div id="questions-mount"></div>
  </section>
</main>

<div class="print-strip zebra"></div>
<footer class="hint-strip">scroll each panel independently — tables stay put on the left, questions build top to bottom on the right</footer>

<script src="https://cdnjs.cloudflare.com/ajax/libs/sql.js/1.10.3/sql-wasm.js"></script>

<script>
let db;

async function initializeDatabase() {

  const SQL = await initSqlJs({
    locateFile: file =>
      `https://cdnjs.cloudflare.com/ajax/libs/sql.js/1.10.3/${file}`
  });

  db = new SQL.Database();

}
  const TABLES = {
  transactions: {
    cols: ["recid","accountid","trancodeid","netamount","effectivedate"],
    rows: [
      [1001,1,10,"500.00","2026-01-05"],
      [1002,1,20,"-200.00","2026-01-10"],
      [1003,2,10,"1500.00","2026-02-01"],
      [1004,2,30,"300.00","2026-02-15"],
      [1005,3,10,"750.00","2026-03-01"],
      [1006,1,20,"-50.00","2026-03-05"],
      [1007,3,30,"200.00","2026-03-20"],
    ]
  },
  transaction_note: {
    cols: ["transactionid","note"],
    rows: [
      [1001,"ACATS in from B3S-732073"],
      [1002,"monthly advisory fee"],
      [1003,"ACATS in from J7Z-119002"],
      [1004,"dividend reinvestment"],
      [1006,"ACATS in from B3S-118820"],
    ]
  },
  account: {
    cols: ["recid","accountno","representativeid","custodianid"],
    rows: [
      [1,"J7Z022009",1,10],
      [2,"J7M242999",2,12],
      [3,"C9B024306",1,10],
    ]
  },
  representative: {
    cols: ["recid","repcode","firstname","lastname"],
    rows: [
      [1,"4BL","Dana","Reyes"],
      [2,"4CT","Marcus","Lin"],
    ]
  },
  trancode: {
    cols: ["recid","trancode","description"],
    rows: [
      [10,100,"ACATS Transfer In"],
      [20,200,"Advisory Fee"],
      [30,300,"Dividend Reinvestment"],
    ]
  },
  monthlyflows: {
    cols: ["investigoaccountid","firm_name","transaction_date"],
    rows: [
      [1,"Freeman Financial- Firm","2026-01-05"],
      [1,"Freeman Financial- Firm","2026-03-05"],
      [2,"Freeman Financial- Firm","2026-02-01"],
      [2,"Freeman Financial- Firm","2026-02-20"],
      [3,"Riverstone Advisors","2026-03-01"],
      [3,"Riverstone Advisors","2026-03-20"],
    ]
  }
};
const ANSWER_KEY = {
  knowledge: [
    ["household"],
    ["aum"],
    ["closed"],
    ["ownership"],
    ["automation"],
    ["addepar"],
    ["broker", "ria"],
    ["historical"],
    ["servicing"],
    ["household"]
  ]
};

const SQL_SOLUTIONS = {
  joins: [
`
SELECT
    a.accountno,
    t.netamount
FROM transactions t
JOIN account a
    ON t.accountid = a.recid;
`,
`
SELECT
    t.recid,
    a.accountno,
    tn.note
FROM transactions t
JOIN account a
    ON t.accountid = a.recid
LEFT JOIN transaction_note tn
    ON tn.transactionid = t.recid;
`
  ]
};

const EXPLANATIONS = {
  joins: [
    "Every transaction joins to exactly one account, so 7 rows are returned.",
    "LEFT JOIN preserves transactions that do not have notes."
 ],

  filtering: [
    `Transactions with trancodeid 20 are excluded because both have negative amounts.`,

    `Not identical. A transaction could have a positive amount while still using trancode 20.`,

    `March records are 1005, 1006, and 1007. Trancode 10 appears once and trancode 30 appears once.`,

    `1003 and 1004 qualify because both occur during February.`,

    `Zero rows remain because account J7M242999 has no March transactions.`
  ],

  regex: [
    `1001 and 1006 match because they contain B3S-###### patterns.`,

    `1001 returns 732073. 1003 returns blank because it uses J7Z rather than B3S.`,

    `Prefix = J7Z. Number = 119002.`,

    `regexp_extract returns an empty string. NULLIF converts it to NULL.`,

    `1001, 1003, and 1006 are TRUE. The others are FALSE.`
  ],

  ctes: [
    `The CTE returns 4 rows.`,

    `J7Z022009 appears twice because two monthlyflow records exist.`,

    `Results are the same, but a CTE is easier to reuse multiple times.`,

    `All three account numbers are returned: J7Z022009, J7M242999, C9B024306.`,

    `Separate CTEs make individual firm counts easier to report.`
  ],

  windows: [
    `2026-03-05 gets rn=1 and 2026-01-05 gets rn=2.`,

    `Monthlyflows collapses to 3 rows, one per account.`,

    `Transaction 1001 survives because it is the earliest transaction for account 1.`,

    `Six rows return because 2 flow rows x 3 transactions = 6 combinations.`,

    `You lose access to non-grouped detail columns.`
  ],

  aliasing: [
    `Backticks are required because the alias contains spaces.`,

    `Yes, accountno and repcode appear twice.`,

    `It allows quick debugging while still highlighting important columns.`,

    `Add the trancode ID as well so descriptions are not the only identifier.`,

    `Rename IDs to business-friendly names such as Account ID, Representative ID, and Custodian ID.`
  ],

  debugging: [
    `A single-row lookup confirms the transaction exists before checking joins.`,

    `No row is expected. If one appears, the missing-note assumption is incorrect.`,

    `Commented lookups are reusable for future investigations.`,

    `Hardcoding forces you to edit multiple places whenever the account changes.`,

    `A parameterized approach makes future investigations quicker and safer.`
  ],

  knowledge: [
    `Householding groups related accounts together so advisors and clients see a complete relationship.`,

    `AUM overstatement occurs when accounts are counted multiple times across households.`,

    `Contra account mapping links closed accounts to replacement accounts.`,

    `Check onboarding, ownership files, feeds, account status, and permissions.`,

    `SFTP automation removes manual uploads and reduces operational risk.`,

    `Addepar provides performance reporting, aggregation, and the investor portal.`,

    `Broker Dealers provide infrastructure and compliance. RIAs operate under a fiduciary model.`,

    `Historical conversions involve legacy records, ownership changes, and closed accounts.`,

    `Servicing teams own client issues while product teams own platform functionality.`,

    `Householding is critical for advisor growth, onboarding, visibility, and client experience.`
  ]
};  
const TOPICS = [
  {
    id: "joins",
    label: "Joins & Schema",
    tables: ["transactions","account","transaction_note","representative"],
    intro: "Start here. Every other topic reuses these joins, so get comfortable moving between transactions, account, transaction_note, and representative before adding filters or regex on top.",
    questions: [
      `Join <code>transactions</code> to <code>account</code> on <code>t.accountid = a.recid</code>. List <code>accountno</code> and <code>netamount</code> for every transaction.<span class="hint">how many rows come back, and why does that match the row count of transactions itself?</span>`,
      `Add <code>transaction_note</code> as a <code>LEFT JOIN</code> on <code>transactionid = t.recid</code>. Transactions 1005 and 1007 have no matching note.<span class="hint">do those two rows disappear, or stay with a blank note column?</span>`,
      `Change that same join to a plain <code>JOIN</code> (inner join) instead of <code>LEFT JOIN</code>.<span class="hint">which two recids vanish from the output, and why exactly those two?</span>`,
      `Join <code>representative</code> on <code>a.representativeid = r.recid</code>. Look up accountno <code>C9B024306</code>.<span class="hint">which repcode comes back — and does adding this join ever shrink your row count in this dataset?</span>`,
      `Combine all four tables (transactions, account, transaction_note as LEFT JOIN, representative) and filter <code>WHERE a.accountno = 'J7Z022009'</code>.<span class="hint">predict the row count and the note value for transaction 1002 before you check it</span>`,
    ]
  },
  {
    id: "filtering",
    label: "Filtering",
    tables: ["transactions","trancode"],
    intro: "Take the four-table query from Joins & Schema and start narrowing it down. Each question swaps one filter for another so you can see where they agree and where they quietly diverge.",
    questions: [
      `Drop the accountno filter from the Topic 1 query. Add <code>WHERE 1=1 AND t.netamount &gt; 0</code>.<span class="hint">which trancode's rows get excluded entirely — check trancode 20's amounts</span>`,
      `Replace that with <code>AND t.trancodeid NOT IN (20)</code>.<span class="hint">does this produce the exact same result as netamount &gt; 0? find one row where the two disagree</span>`,
      `Replace the filter again with <code>AND month(t.effectivedate) = 3</code>.<span class="hint">which recids match, and which trancode shows up twice in March?</span>`,
      `Switch to <code>AND t.effectivedate BETWEEN '2026-02-01' AND '2026-02-28'</code>.<span class="hint">does 1004 (dated 2026-02-15) qualify? what would change if effectivedate were a timestamp instead of a date?</span>`,
      `Add <code>AND a.accountno = 'J7M242999'</code> on top of the March filter from question 3.<span class="hint">how many rows survive both conditions at once?</span>`,
    ]
  },
  {
    id: "regex",
    label: "Regex Extraction",
    tables: ["transaction_note"],
    intro: "All five notes live in one small table — enough variety to test a regex against real matches and real misses before you trust it on production data.",

function renderTabs(activeId) {
  const tabsEl = document.getElementById('tabs');
  tabsEl.innerHTML = '';
  TOPICS.forEach((t, i) => {
    const btn = document.createElement('button');
    btn.className = 'tab' + (t.id === activeId ? ' active' : '');
    btn.innerHTML = `<span class="num">${String(i+1).padStart(2,'0')}</span>${t.label}`;
    btn.onclick = () => selectTopic(t.id);
    tabsEl.appendChild(btn);
  });
}

function renderTables(relevantTables) {
  const mount = document.getElementById('tables-mount');
  mount.innerHTML = '';
  Object.entries(TABLES).forEach(([name, def]) => {
    const isRelevant = relevantTables.includes(name);
    const card = document.createElement('div');
    card.className = 'table-card' + (isRelevant ? ' relevant' : ' dim');

    const label = document.createElement('div');
    label.className = 'table-label';
    label.innerHTML = `<span><span class="comment-slash">--</span>${name}</span><span>${def.rows.length} rows</span>`;
    card.appendChild(label);

    const wrap = document.createElement('div');
    wrap.className = 'table-wrap';
    const table = document.createElement('table');
    table.className = 'sample';
    const thead = document.createElement('thead');
    const headRow = document.createElement('tr');
    def.cols.forEach(c => {
      const th = document.createElement('th');
      th.textContent = c;
      headRow.appendChild(th);
    });
    thead.appendChild(headRow);
    table.appendChild(thead);

    const tbody = document.createElement('tbody');
    def.rows.forEach(row => {
      const tr = document.createElement('tr');
      row.forEach(val => {
        const td = document.createElement('td');
        td.textContent = val;
        tr.appendChild(td);
      });
      tbody.appendChild(tr);
    });
    table.appendChild(tbody);
    wrap.appendChild(table);
    card.appendChild(wrap);
    mount.appendChild(card);
  });
}
function getErrorContext(sql, errorMessage) {

  const lines = sql.split('\n');

  return lines
    .map((line, idx) =>
      `${idx + 1} | ${line}`
    )
    .join('\n');
}

function selectTopic(id) {
  const topic = TOPICS.find(t => t.id === id);
  const idx = TOPICS.findIndex(t => t.id === id);
  document.getElementById('topic-counter').textContent = `topic ${idx+1} / ${TOPICS.length}`;
